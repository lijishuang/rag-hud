<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG HUD · 知识库数据流</title>
<style>
  :root{
    --bg:#05070a;
    --ink:#e8f6ff;
    --dim:rgba(232,246,255,.45);
    --faint:rgba(232,246,255,.12);
    --accent:#32f08c;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"SF Pro Text","PingFang SC",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}

  #hud{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:1}

  .fx{position:fixed;inset:0;pointer-events:none;z-index:2}
  .fx--scan{
    background:repeating-linear-gradient(to bottom,rgba(232,246,255,.05) 0 1px,transparent 1px 3px);
    mix-blend-mode:screen;opacity:.55;
  }
  .fx--vig{background:radial-gradient(ellipse at 42% 50%,transparent 28%,rgba(0,0,0,.62) 100%)}

  .ui{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    padding:24px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .bar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}

  .ttl{font-size:14px;font-weight:600;letter-spacing:.34em;text-transform:uppercase}
  .mode{
    display:inline-block;margin-left:10px;padding:2px 7px;vertical-align:2px;
    border:1px solid var(--faint);border-radius:2px;
    font-size:9px;letter-spacing:.18em;color:var(--dim);font-weight:400;
    transition:color .2s,border-color .2s;
  }
  .mode.on{color:var(--accent);border-color:var(--accent)}
  .sub{margin-top:6px;font-size:11px;color:var(--dim);letter-spacing:.08em}
  .q{margin-top:14px;font-size:12px;font-family:var(--mono);color:var(--ink)}
  .q b{color:var(--accent);font-weight:500;letter-spacing:.12em;margin-right:8px}

  .metrics{display:flex;gap:28px;text-align:right}
  .metrics dt{font-size:10px;letter-spacing:.16em;color:var(--dim)}
  .metrics dd{margin-top:4px;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
  .metrics dd.hit{color:var(--accent)}

  .stages{display:flex;gap:8px;list-style:none}
  .stages li{
    padding:7px 12px;border:1px solid var(--faint);border-radius:2px;
    font-size:12px;color:var(--dim);letter-spacing:.06em;
    background:rgba(5,7,10,.86);
    transition:color .18s,border-color .18s,background .18s;
  }
  .stages li small{display:block;font-size:9px;letter-spacing:.16em;opacity:.6;margin-top:2px}
  .stages li.on{border-color:var(--accent);color:var(--ink);background:#0a1a12}
  .stages li.on small{color:var(--accent);opacity:1}

  .hint{font-size:10px;line-height:1.8;color:var(--dim);text-align:right;letter-spacing:.06em;font-family:var(--mono)}

  .answer{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%);
    width:min(620px,74vw);padding:12px 16px;z-index:4;pointer-events:none;
    border:1px solid var(--faint);border-left:2px solid var(--accent);
    background:rgba(5,7,10,.9);border-radius:2px;
  }
  .answer[hidden]{display:none}
  .answer__tag{display:block;font-size:9px;letter-spacing:.2em;color:var(--accent);margin-bottom:6px}
  .answer__text{
    font-size:13px;line-height:1.75;color:var(--ink);letter-spacing:.02em;
    max-height:112px;overflow:hidden;
  }
  .answer__text::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
  .answer.done .answer__text::after{content:"";animation:none}
  @keyframes blink{50%{opacity:0}}

  @media (max-width:720px){
    .ui{padding:16px}
    .metrics{gap:16px}
    .metrics dd{font-size:14px}
    .metrics div:nth-child(2){display:none}
    .hint{display:none}
    .stages li{padding:6px 8px;font-size:11px}
    .answer{bottom:88px;width:86vw;padding:10px 12px}
    .answer__text{font-size:12px;max-height:84px}
  }
</style>
</head>
<body>
<canvas id="hud"></canvas>
<div class="fx fx--scan"></div>
<div class="fx fx--vig"></div>

<div class="ui">
  <header class="bar">
    <div>
      <h1 class="ttl">RAG Pipeline <span class="mode" id="mode">CONNECTING</span></h1>
      <p class="sub">知识库采集 → 向量库 → 检索 → 生成</p>
      <p class="q"><b>QUERY</b><span id="q">—</span></p>
    </div>
    <dl class="metrics">
      <div><dt>TOP-K</dt><dd id="m-topk">—</dd></div>
      <div><dt>RECALL</dt><dd id="m-recall">—</dd></div>
      <div><dt>LATENCY</dt><dd id="m-lat">—</dd></div>
      <div><dt>TOKENS</dt><dd id="m-tok">—</dd></div>
    </dl>
  </header>

  <div class="answer" id="answer" hidden>
    <span class="answer__tag">ANSWER</span>
    <p class="answer__text" id="answerText"></p>
  </div>

  <footer class="bar">
    <ol class="stages" id="stages">
      <li>向量化<small>EMBED</small></li>
      <li>召回<small>TOP-K</small></li>
      <li>重排<small>RERANK</small></li>
      <li>生成<small>ANSWER</small></li>
    </ol>
    <p class="hint">实线 = 采集源写向量库 · 虚线 = 检索回传查询端<br>白点 = 召回的片段 · 绿点 = 重排命中 · 环进度 = 阶段进度</p>
  </footer>
</div>

<script src="hud.js"></script>
<script>
(() => {
  'use strict';

  /* 换后端：?api=https://your-host/api/rag/stream */
  const API = new URLSearchParams(location.search).get('api')
    || 'http://127.0.0.1:8787/api/rag/stream';
  const QUERY = '这份账单为什么多收了 42 元？';

  const $ = id => document.getElementById(id);
  const el = {
    mode: $('mode'), q: $('q'), answer: $('answer'), answerText: $('answerText'),
    topk: $('m-topk'), recall: $('m-recall'), lat: $('m-lat'), tok: $('m-tok'),
    stages: [...document.querySelectorAll('#stages li')],
  };
  el.q.textContent = QUERY;

  const STAGE_ORDER = ['embed', 'retrieve', 'rerank', 'generate'];

  const hud = RagHud.create($('hud'), {
    onStage(name) {
      const chip = name === 'done' ? 'generate' : name;
      el.stages.forEach((li, i) => li.classList.toggle('on', STAGE_ORDER[i] === chip));
    },
    onStats(s) {
      el.topk.textContent = s.topk;
      el.recall.textContent = s.recall;
      el.lat.textContent = s.latency;
      el.tok.textContent = s.tokens;
      el.topk.classList.toggle('hit',
        s.stage === 'rerank' || s.stage === 'generate' || s.stage === 'done');
    },
    onAnswer(text, done) {
      el.answer.hidden = !text;
      el.answer.classList.toggle('done', !!done);
      el.answerText.textContent = text;
    },
  });

  /* ---------------- SSE ---------------- */
  hud.attachSSE(API, {
    query: QUERY,
    reconnect: true,
    reconnectDelay: 3200,
    onMeta(d) { if (d.query) el.q.textContent = d.query; },
    onStatus(status) {
      el.mode.textContent = status === 'live' ? 'LIVE SSE' : 'OFFLINE · 模拟';
      el.mode.classList.toggle('on', status === 'live');
    },
    onFail() {
      el.mode.textContent = 'OFFLINE · 模拟';
      el.mode.classList.remove('on');
      startMock();
    },
  });

  /* ---------------- 后端不可达时的本地模拟 ---------------- */
  let mockTimer = null;
  function startMock() {
    clearTimeout(mockTimer);
    const LABELS = ['手册 §3.2 计费规则', 'FAQ 退款政策', 'API /v2/search', '工单 #4821 记录',
      'SLA 协议 第 4 条', '定价页快照', '上线公告 2026-09', '风控策略说明'];
    const CHUNKS = Array.from({ length: 36 }, (_, i) => ({
      id: 'ch_' + String(1000 + i),
      label: LABELS[i] || '',
      score: Number((0.93 - i * 0.018).toFixed(2)),
    }));
    const ANSWER = '账单多出的 42 元来自 §3.2 的阶梯计费：套餐内 1000 次调用已在 3 月 14 日用完，' +
      '超出部分按 0.042 元/次计费，本周期共超出 1000 次，因此产生 42 元。';

    hud.reset();
    hud.setStage('embed');
    hud.log('[embed] dim=1536 norm=1.000');

    mockTimer = setTimeout(() => {
      hud.setStage('retrieve');
      hud.setCandidates(CHUNKS);
    }, 900);

    mockTimer = setTimeout(() => {
      hud.setStage('rerank');
      setTimeout(() => hud.setHits(CHUNKS.slice(0, 8), { recall: 0.96, latency: 0.42 }), 380);
    }, 2600);

    mockTimer = setTimeout(() => {
      hud.setStage('generate');
      let i = 0;
      const timer = setInterval(() => {
        if (i >= ANSWER.length) {
          clearInterval(timer);
          hud.done({ tokens: 186, latency: 2.4 });
          mockTimer = setTimeout(startMock, 3600);
          return;
        }
        hud.token(ANSWER.slice(i, i + 4));
        i += 4;
      }, 45);
    }, 3900);
  }
})();
</script>
</body>
</html>
